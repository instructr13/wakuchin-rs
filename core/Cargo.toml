[package]
name = "wakuchin"
version = "0.3.0"
authors = ["P2P-Develop"]
categories = ["science", "text-processing"]
keywords = ["text"]
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/P2P-Develop/wakuchin-rs"
description = "A next generation wakuchin researcher software written in Rust"
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
wasm-bindgen = ["instant/wasm-bindgen"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8" }

[dependencies]
anyhow = "1.0"
arc-swap = "1.9.2"
atomig = { version = "0.4.3", features = ["derive"] }
base64 = "0.23"
fastrand = "2.5"
instant = "0.1"
itoa = "1.0"
itertools = "0.15"
parking_lot = "0.12.5"
regex = "1.7"
rmp-serde = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smooth = "0.3"
thiserror = "2.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
signal-hook = "0.4"

[[bench]]
name = "bench_core"
harness = false
