[package]
name = "wakuchin_cli"
version = "0.3.0"
authors = ["P2P-Develop"]
categories = ["command-line-utilities", "science"]
keywords = ["cli"]
default-run = "wakuchin"
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/P2P-Develop/wakuchin-rs"
description = "A next generation wakuchin researcher software written in Rust"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "wakuchin"
path = "src/main.rs"

[features]
sequential = []

[build-dependencies]
shadow-rs = "2.0"

[dependencies]
wakuchin = { version = "0.3.0", path = "../core" }

anyhow = "1.0"
clap = { version = "4.0", features = ["cargo", "derive"] }
clap-serde-derive = "0.2"
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
human_format = "1.0"
humantime = "2.1"
humantime-serde = "1.1"
itoa = "1.0"
miette = { version = "7.6.0", features = ["fancy-no-backtrace"] }
owo-colors = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shadow-rs = "2.0"
thiserror = "2.0"
toml = "1.1"
yaml_serde = "0.10"

[target.'cfg(all(not(target_os = "android"), not(target_env = "msvc"), not(target_arch = "wasm32")))'.dependencies]
tikv-jemallocator = "0.7"
